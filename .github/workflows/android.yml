name: Android

# Only when the app changes: a cold Gradle run takes about five minutes, and the
# server's tests (ci.yml) don't need it.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # The runner already has the Android SDK; AGP fetches any build-tools it lacks.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/build.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
