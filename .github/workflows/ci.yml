name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    # The oldest Python the README supports, and the newest, which the home server runs: how deep
    # json.loads nests changed in 3.14. Each runs to the end even when the other fails.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    name: server (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          # No requirements file to key the cache on: this workflow is what names bcrypt.
          cache-dependency-path: .github/workflows/ci.yml

      - name: Install bcrypt
        run: pip install bcrypt

      # discover, not the README's list of six, so a new test file runs here too.
      - name: Server tests
        working-directory: tests
        run: python -m unittest discover
